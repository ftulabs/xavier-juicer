MACHINE = "jetson-agx-xavier-devkit"
DISTRO ?= "poky"
DISTRO_NAME = "Momonga"
DISTRO_VERSION = "1.0"
hostname:pn-base-files = "momonga"
DEFAULT_TIMEZONE = "Asia/Ho_Chi_Minh"
ROOT_HOME = "/root"

DISTRO_FEATURES:append = " systemd usrmerge pam virtualization seccomp vulkan x11"
DISTRO_FEATURES:remove = " wayland directfb 3dfx"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

EXTRA_IMAGE_FEATURES += "tools-sdk tools-debug ssh-server-openssh package-management"
FORTRAN:forcevariable = ",fortran"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
CONF_VERSION = "2"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

# Redundant (A/B) layout: bootloader A/B plus APP/APP_b rootfs slots of
# ROOTFSPART_SIZE_DEFAULT / 2 (14 GiB) each, with rollback by the UEFI boot
# chain and nv_update_verifier. Rootfs updates: momonga-ota (momonga-recovery).
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "1"

# Reboot 10 s after a kernel panic from the start of boot. The kernel default
# (CONFIG_PANIC_TIMEOUT=0) waits forever, and the momonga-recovery sysctl only
# applies once systemd runs.
KERNEL_ARGS:append = " panic=10"

# Boot in MAXN, all 8 cores at full clock. A mode set with nvpmodel -m persists.
NVPMODEL_CONFIG_DEFAULT = "0"

# Each A/B slot is half the eMMC rootfs area; keep 1 GiB of guaranteed free
# space instead of 8 GiB. Bulk data lives on the SD card.
IMAGE_ROOTFS_EXTRA_SPACE = "1048576"

# dnf package feed. Set PACKAGE_FEED_URIS in config/local.private.conf to the
# base URL that serves build/tmp/deploy/rpm (see scripts/momonga-publish-feed).
PACKAGE_FEED_BASE_PATHS = "rpm"
# Monotonic package revisions so dnf sees rebuilt packages as upgrades.
PRSERV_HOST = "localhost:0"
LICENSE_FLAGS_ACCEPTED += "commercial"

CORE_IMAGE_EXTRA_INSTALL += " \
    ripgrep vulkan-headers vulkan-loader tegra-libraries-vulkan xauth \
    openssh openssh-sftp-server wired-ethernet-dhcp network-time-sync tzdata \
    tailscale cloudflared \
    cuda-toolkit cuda-cudart cuda-cudart-dev cuda-libraries cuda-nvcc cuda-compiler \
    cudnn tensorrt-core tensorrt-plugins tensorrt-trtexec cuda-compat-12-2 \
    docker-moby docker-compose nvidia-container-toolkit nvidia-docker \
    libnvidia-container-tools libnvidia-container-jetson \
    perf sysstat valgrind strace numactl \
    lapack hdf5 protobuf protobuf-compiler \
    cmake git python3 python3-pip python3-setuptools python3-wheel python3-numpy curl \
    coreutils gawk procps sed \
    packagegroup-rust-sdk-target \
    zstd pigz rsync pciutils usbutils e2fsprogs-mke2fs util-linux \
    tmux bash zsh jq tree sudo shadow btop htop less wget ethtool i2c-tools can-utils \
    nftables ufw mosh mosh-server distrobox \
    momonga-branding \
    momonga-locale \
    momonga-recovery xavier-site-config \
    tegra-redundant-boot tegra-redundant-boot-update-engine \
    tegra-libraries-gbm-backend \
    kernel-module-vhost-vsock kernel-module-vhost-net \
    neofetch \
    fastfetch \
    tegra-tools-tegrastats tegra-tools-jetson-clocks \
    tegra-nvpmodel-base tegra-nvpmodel \
    python3-jetson-stats \
    "

# core-image-minimal has no packagegroup-base, which is where the machine's
# packages normally come in: fan control (nvfancontrol, pwm-fan), the thermal
# sensors (tegra-bpmp-thermal, max77620-thermal), power monitors (ina3221),
# tegra-udrm for /dev/dri, HDMI audio, and the NVIDIA boot services.
CORE_IMAGE_EXTRA_INSTALL += "${MACHINE_EXTRA_RDEPENDS} ${MACHINE_EXTRA_RRECOMMENDS}"

TOOLCHAIN_TARGET_TASK:append = " vulkan-headers vulkan-loader-dev tegra-libraries-vulkan"

# Console-only root password for local recovery; SSH stays key-only
# (PermitRootLogin prohibit-password). Set MOMONGA_ROOT_PASSWORD_HASH in
# config/local.private.conf to a crypt(3) hash from `openssl passwd -6`.
# Unset, root has no password and cannot log in on the console.
MOMONGA_ROOT_PASSWORD_HASH ??= ""
IMAGE_CLASSES += "extrausers"
EXTRA_USERS_PARAMS:append = "${@"usermod -p '%s' root;" % d.getVar('MOMONGA_ROOT_PASSWORD_HASH').replace('$', '\\$') if d.getVar('MOMONGA_ROOT_PASSWORD_HASH') else ''}"

# Login users: name:uid:shell. They are in wheel (passwordless sudo, from
# xavier-site-config), docker and the device groups; /home is on the SD card.
# Their SSH keys are MOMONGA_USER_KEY_<name> in config/local.private.conf.
MOMONGA_USERS ?= "minh:1000:/bin/bash triph:1001:/bin/zsh nhansp:1002:/bin/bash"
MOMONGA_USER_LINGER ?= "triph"
IMAGE_CLASSES += "momonga-users"

PACKAGECONFIG:append:pn-sudo = " pam-wheel"
# Legacy iptables backend: the L4T 5.10 kernel (tegra_defconfig) has no
# nf_tables, so the nft backend fails ("Could not fetch rule set generation
# id") and Docker cannot create its NAT chain.
PACKAGECONFIG:remove:pn-iptables = "libnftnl"
IMAGE_LINGUAS:append = " c en-us"

CUDA_ARCHITECTURES = "72"

PREMIRRORS:prepend = " \
    git://nv-tegra.nvidia.com/.* git://github.com/oe4t/ \
    https://nv-tegra.nvidia.com/.* git://github.com/oe4t/ \
"
BB_GIT_SHALLOW = "1"
BB_GIT_SHALLOW:pn-docker-compose = "0"
BB_GIT_SHALLOW_DEPTH = "1"
BB_GENERATE_SHALLOW_TARBALLS = "1"
FETCHCMD_git = "git -c http.version=HTTP/1.1 -c gc.autoDetach=false -c core.pager=cat -c safe.bareRepository=all"

# Project checkout; scripts/setup-jetson-xavier-build sets it for build directories outside it.
MOMONGA_ROOT ??= "${TOPDIR}/.."
INHERIT += "root-shell-bash login-motd"
LOGIN_MOTD_FILE = "${MOMONGA_ROOT}/config/issue.net"
LOGIN_MOTD_SCRIPT = "${MOMONGA_ROOT}/config/login-motd.sh"
LOGIN_MOTD_PROFILE = "${MOMONGA_ROOT}/config/login-motd.profile"
ROOTFS_POSTPROCESS_COMMAND:append = " set_root_shell_to_bash; install_login_motd; "
